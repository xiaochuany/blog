site_name: Xiaochuan's blog
site_description: life is short
site_url: https://xiaochuany.github.io/blog/
use_directory_urls: true

theme:
  variant: classic
  features:
    # - navigation.tabs
    - navigation.indexes
    - navigation.instant
    # - toc.integrate
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

plugins:
  - search
  - blog:
      blog_dir: .
      post_url_date_format: yyyy/MM/dd
      post_url_format: "{date}/{slug}"
      blog_toc: true
      archive_date_format: yyyy
      categories_allowed:
        - Tutorial
        - TIL
        - Essay
        - Technical
        - Analysis
      pagination_per_page: 5
  - tags
  - rss:
      # Browser XSLT support is being removed; serve plain RSS XML.
      stylesheet: ""
      match_path: "posts/.*"
      date_from_meta:
        as_creation: date.created
        as_update: date.updated
      categories:
        - categories
        - tags

extra:
  social:
    - icon: fontawesome/brands/linkedin
      name: xiaochuan on LinkedIn
      link: https://www.linkedin.com/in/xiaochuan-yang-088975188/
    - icon: fontawesome/brands/youtube
      name: xiaochuan on Youtube
      link: https://www.youtube.com/@xiaochuanyang
    - icon: fontawesome/brands/x-twitter
      name: xiaochuan on X
      link: https://x.com/xiaochuandev
  analytics:
    provider: google
    property: G-VQFRTKQCML

markdown_extensions:
  #footnotes
  - footnotes
  # math
  - pymdownx.arithmatex:
      generic: true
  # code
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ['.', 'docs/src']
      check_paths: true
  # emoji
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:zensical.extensions.emoji.twemoji
      emoji_generator: !!python/name:zensical.extensions.emoji.to_svg
  # diagram
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # callout
  - admonition
  - pymdownx.details
  # url
  - pymdownx.magiclink

extra_javascript:
  - js/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

